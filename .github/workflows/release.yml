name: Release

# Push a version tag on main (git tag v1.0.0 && git push origin v1.0.0) to publish a release
# with one installable .zip per agent skill plus SHA256SUMS.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  skills-release:
    name: Package skills and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the GitHub Release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.0
          environments: skills
          locked: true
          cache: true
          cache-write: false        # releases never write the shared cache
      - name: Tag must match the package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"; exit 1
          fi
      - name: Validate and package skills
        run: pixi run --locked -e skills package-skills
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gromatrix-skills-${{ github.ref_name }}
          path: dist/skills/
      - name: Create (or update) the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/skills/*.zip dist/skills/SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "gromatrix ${GITHUB_REF_NAME}" --generate-notes --verify-tag
          fi
