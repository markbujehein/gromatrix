name: Release

# Push a version tag on main (git tag v0.2.0 && git push origin v0.2.0) to publish a release.
# The plugin installs straight from the repository (/plugin marketplace add markbujehein/gromatrix@v0.2.0),
# so the release carries no archives: it validates the plugin and publishes generated notes.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  plugin-release:
    name: Validate the plugin and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the GitHub Release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.0
          environments: skills
          locked: true
          cache: true
          cache-write: false        # releases never write the shared cache
      - name: Tag must match the package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"; exit 1
          fi
      - name: Validate the plugin
        run: pixi run --locked -e skills check-plugin
      - name: Create (or update) the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "gromatrix ${GITHUB_REF_NAME}" --generate-notes --verify-tag
          fi
