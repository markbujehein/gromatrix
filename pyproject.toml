[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gromatrix"
version = "1.0.0"
description = "PDB -> GROMACS enzyme x target simulation matrix with a batch-locked forcefield"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "numpy>=1.24", "scipy>=1.10", "biopython>=1.80"]
# openmm + pdbfixer are needed for steps B and D; tmtools is optional (cross-check only)

[project.optional-dependencies]
# rdkit/openmm/pdbfixer/acpype/openbabel/gromacs come from conda-forge (pixi.toml, or see README install)
test = ["pytest>=7"]

[project.scripts]
gmxprep-gmx = "gromatrix.gmx_prep:main"
gmxprep-status = "gromatrix.status:main"
gmxprep-fetch = "gromatrix.fetch:main"
gmxprep-fix = "gromatrix.fix:main"
gmxprep-extract = "gromatrix.extract:main"
gmxprep-relax = "gromatrix.relax:main"
gmxprep-afcompare = "gromatrix.afdb:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: end-to-end benchmarks (1XVP); deselect with -m 'not slow'"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, simplify-lite, numpy-specific rules
select = ["F", "E", "W", "I", "B", "UP", "NPY", "RUF100"]
ignore = [
  "E741",  # `l` as a variable name is idiomatic for line-by-line PDB parsing
  "B905",  # zip() without strict= is intentional where lengths are validated upstream
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.coverage.run]
source = ["gromatrix"]
branch = true
