# Codecov: report coverage; fail a check only on a clear regression.
coverage:
  status:
    project:
      default:
        target: auto      # compare with the base commit
        threshold: 2%     # allow small dips
    patch:
      default:
        target: 60%
        informational: true   # shown on the PR, never blocks it
github_checks:
  annotations: true   # mark uncovered lines in the PR diff
comment:
  layout: "condensed_header, diff, flags, files"
  require_changes: false   # comment on every PR, not only when coverage changes
