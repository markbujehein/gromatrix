# Pixi workspace for gromatrix: the single source of truth for environments.
#   pixi run test        fast unit tests (default env, Python 3.12)
#   pixi run test-all    full suite incl. the offline end-to-end regression, with coverage
#   pixi run check       everything CI checks: lint + syntax (ruff), plugin validation, fast tests
#   pixi run fix         auto-fix what ruff can (imports, formatting); then run check again
#   pixi run lint        ruff check + ruff format --check (tiny env, no science stack)
#   pixi run hooks       install the pre-commit / pre-push git hooks (.pre-commit-config.yaml)
#   pixi run -e md ...   adds GROMACS / AmberTools / Open Babel for real step F-H runs
[workspace]
name = "gromatrix"
version = "0.2.0"
description = "PDB -> GROMACS simulation matrix with a batch-locked forcefield"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

# ---------------------------------------------------------------- runtime (steps A-E; F-G drive external GROMACS)
[dependencies]
python = ">=3.10"
numpy = ">=1.24"
scipy = ">=1.10"
biopython = ">=1.80"
pyyaml = ">=6"
openmm = ">=8.1"
pdbfixer = ">=1.9"
rdkit = ">=2023.09"

[pypi-dependencies]
gromatrix = { path = ".", editable = true }

# ---------------------------------------------------------------- workspace tasks
# These span environments (ruff lives in `lint`, the plugin check in `skills`, pytest in `default`).
[tasks.check]
description = "lint + syntax (ruff), plugin validation, fast tests: what CI checks, read-only"
depends-on = [
  { task = "lint", environment = "lint" },
  { task = "check-plugin", environment = "skills" },
  { task = "test", environment = "default" },
]

[tasks.fix]
description = "auto-fix what ruff can (safe fixes + formatting); run `pixi run check` afterwards"
depends-on = [{ task = "ruff-fix", environment = "lint" }]

[tasks.hooks]
description = "install the pre-commit and pre-push git hooks"
depends-on = [{ task = "install-hooks", environment = "lint" }]

# ---------------------------------------------------------------- features
[feature.test.dependencies]
pytest = ">=8"
pytest-cov = ">=5"

[feature.test.tasks]
test = { cmd = "pytest -q -m 'not slow'", description = "fast unit tests" }
test-all = { cmd = "pytest -q --cov=gromatrix --cov-report=term-missing:skip-covered --cov-report=xml", description = "full suite with coverage (incl. offline end-to-end regression)" }

[feature.lint.dependencies]
ruff = ">=0.6"
pre-commit = ">=3"

[feature.lint.tasks]
lint = { depends-on = ["ruff-check", "ruff-format-check"], description = "ruff lint + format check" }
ruff-check = "ruff check src tests scripts benchmarks"
ruff-format-check = "ruff format --check src tests scripts benchmarks"
ruff-fix = { cmd = "ruff check --fix src tests scripts benchmarks && ruff format src tests scripts benchmarks", description = "safe auto-fixes, then format (what `pixi run fix` runs)" }
install-hooks = { cmd = "pre-commit install", description = "install the git hooks from .pre-commit-config.yaml" }

# Step H (trajectory analysis): MDAnalysis + headless matplotlib. In the test envs so CI
# exercises the analysis end to end on a synthetic trajectory.
[feature.analysis.dependencies]
mdanalysis = ">=2.7"
matplotlib-base = ">=3.8"

# Plugin validation needs only Python + PyYAML (tiny env, used by CI).
[feature.skills.dependencies]
python = "3.12.*"
pyyaml = ">=6"

[feature.skills.tasks]
check-plugin = { cmd = "python scripts/check_plugin.py", description = "validate plugin.json, marketplace.json, skills/, agents/ and ${CLAUDE_PLUGIN_ROOT} paths" }

# Python versions: 3.12 is canonical (PRs); 3.10/3.13 are the compatibility edges
# of `requires-python = ">=3.10"`, tested only on pushes to main/dev.
[feature.py312.dependencies]
python = "3.12.*"

[feature.py310.dependencies]
python = "3.10.*"

[feature.py313.dependencies]
python = "3.13.*"

# Heavy MD stack for real step-F builds; never installed in CI.
[feature.md]
platforms = ["linux-64", "osx-arm64"]

[feature.md.dependencies]
gromacs = ">=2023"
acpype = "*"
openbabel = "*"
networkx = "*"

# ---------------------------------------------------------------- environments
[environments]
default = { features = ["py312", "analysis", "test"], solve-group = "default" }
lint = { features = ["lint"], no-default-feature = true }
skills = { features = ["skills"], no-default-feature = true }
py310 = { features = ["py310", "analysis", "test"] }
py313 = { features = ["py313", "analysis", "test"] }
md = { features = ["py312", "analysis", "md", "test"], solve-group = "default" }
