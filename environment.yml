name: gmxprep
channels: [conda-forge]
dependencies:
  - python=3.11
  - gromacs>=2023        # needs C-rescale barostat
  - rdkit
  - openbabel
  - acpype               # pulls AmberTools (antechamber, sqm)
  - openmm>=8
  - pdbfixer
  - mdanalysis
  - biopython
  - scipy
  - tmtools              # TM-score
  - networkx             # cgenff_charmm2gmx
  - pyyaml
  - requests
  - pytest
  - pip
  - pip: ["-e ."]
# CHARMM route also needs (not on conda): the CGenFF program (SilcsBio; set CGENFF_BIN)
# or server-generated .str files, cgenff_charmm2gmx_py3_nx2.py (set CGENFF2GMX), and the
# charmm36-jul2022.ff port from the MacKerell lab placed in the batch dir or on GMXLIB.
